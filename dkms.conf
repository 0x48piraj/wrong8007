PACKAGE_NAME="wrong8007"
PACKAGE_VERSION="0.1.4"

BUILT_MODULE_NAME[0]="wrong8007"
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="make KDIR=${kernel_source_dir} build"

# Build profile chosen by the operator; every trigger otherwise
if [ -r /etc/wrong8007/build.config ]; then
	MAKE[0]="${MAKE[0]} PROFILE=/etc/wrong8007/build.config"
fi

AUTOINSTALL="yes"

BUILD_EXCLUSIVE_KERNEL="^(5\.([4-9]|[1-9][0-9])|[6-9]|[1-9][0-9])\."
