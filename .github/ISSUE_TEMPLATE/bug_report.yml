name: Bug report
description: Report a bug in Wrong Boot
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Leave out real phrases, USB rules and addresses everywhere in this form.

        Report a vulnerability [privately](https://github.com/0x48piraj/wrong8007/security/advisories/new) instead. The [security policy](https://github.com/0x48piraj/wrong8007/blob/master/SECURITY.md) says what counts as one.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong, in one or two sentences.
      placeholder: The keyboard trigger stops firing after the machine resumes from suspend.
    validations:
      required: true

  - type: checkboxes
    id: triggers
    attributes:
      label: Affected triggers
      options:
        - label: Keyboard
        - label: USB
        - label: Network
        - label: Core or tooling only

  - type: input
    id: version
    attributes:
      label: Wrong Boot version
      description: Release or commit. `modinfo -F version wrong8007` prints the installed release.
      placeholder: 0.1.2
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel version
      description: Output of `uname -r`.
      placeholder: 6.12.23
    validations:
      required: true

  - type: input
    id: distribution
    attributes:
      label: Distribution
      placeholder: Debian 13
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - Arch package (makepkg in packaging/arch)
        - Debian or Ubuntu package
        - NixOS module
        - DKMS from source (make dkms-install)
        - From source (make install)
        - Development load (make load)
    validations:
      required: true

  - type: textarea
    id: profile
    attributes:
      label: Build profile
      description: "`CONFIG_WRONG8007_*` lines of `.config` or `/etc/wrong8007/build.config`. NixOS users give `services.wrong8007.triggers` instead. Leave it empty when every trigger is built."
      render: text

  - type: input
    id: parameters
    attributes:
      label: Parameters
      description: Names of the parameters you set, without their values.
      placeholder: exec, phrase, usb_devices

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands and actions from a fresh boot. Put placeholders in place of trigger values.
      placeholder: |
        1. sudo systemctl start wrong8007
        2. Suspend and resume the machine
        3. Type the phrase
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The payload starts once the phrase is typed.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Kernel log
      description: Output of `sudo dmesg | grep wrong8007` from the boot with the bug. Add `journalctl -b -u wrong8007` when the service loads the module. A trigger value in the log is a vulnerability; report it privately.
      render: text

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else a maintainer should know.
