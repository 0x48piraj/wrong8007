name: Feature request
description: Suggest a new trigger or an improvement to Wrong Boot
title: "[Feature]: "
labels: ["feature"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. The [design philosophy](https://github.com/0x48piraj/wrong8007/blob/master/docs/manifesto.md) and the [security model](https://github.com/0x48piraj/wrong8007/blob/master/docs/security-model.md) say what Wrong Boot sets out to do and what it leaves out.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What the feature changes for users, in one or two sentences.
      placeholder: A trigger that runs the payload when the machine switches to battery power.
    validations:
      required: true

  - type: checkboxes
    id: triggers
    attributes:
      label: Affected triggers
      options:
        - label: Keyboard
        - label: USB
        - label: Network
        - label: New trigger
        - label: Core or tooling only

  - type: textarea
    id: why
    attributes:
      label: Why
      description: Situation where you need it and what you do without it today.
      placeholder: A laptop pulled off its charger often means someone is carrying it away.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Ideas for the implementation, kernel documentation or similar projects.
      placeholder: The kernel's power_supply notifier reports changes on the AC adapter.
