name: release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  release:
    name: source tarball
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: tarball, checksum and notes
        run: |
          v=$GITHUB_REF_NAME
          test "$(sed -n 's/^PACKAGE_VERSION="\(.*\)"$/\1/p' dkms.conf)" = "$v"
          t=wrong8007-$v.tar.gz
          git archive --format=tar --prefix="wrong8007-$v/" HEAD | gzip -9n > "$t"
          sha256sum "$t" > SHA256SUMS
          awk -v h="## $v " 'index($0, h) == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG > notes.md
          grep -q . notes.md

      - name: build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: wrong8007-${{ github.ref_name }}.tar.gz

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          t=wrong8007-$GITHUB_REF_NAME.tar.gz
          cp "$BUNDLE" "$t.sigstore.json"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "v$GITHUB_REF_NAME" \
            --notes-file notes.md "$t" "$t.sigstore.json" SHA256SUMS
