name: wrong8007 build routine

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: linux ${{ matrix.kernel }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kernel: "5.4.290",  runner: ubuntu-22.04 }
          - { kernel: "5.10.236", runner: ubuntu-22.04 }
          - { kernel: "5.15.180", runner: ubuntu-22.04 }
          - { kernel: "6.1.134",  runner: ubuntu-24.04 }
          - { kernel: "6.6.87",   runner: ubuntu-24.04 }
          - { kernel: "6.12.23",  runner: ubuntu-24.04 }
          - { kernel: "6.18.64",  runner: ubuntu-24.04 }
          - { kernel: "7.2.11",   runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libelf-dev libssl-dev

      - name: restore kernel tree
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: linux-${{ matrix.kernel }}
          key: kernel-prepared-${{ matrix.kernel }}-${{ matrix.runner }}-v2

      - name: download and prepare kernel ${{ matrix.kernel }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          v=${{ matrix.kernel }}
          curl -fsSL "https://cdn.kernel.org/pub/linux/kernel/v${v%%.*}.x/linux-$v.tar.xz" | tar -xJ
          cd "linux-$v"
          make -s defconfig
          ./scripts/config -e MODULES -e MODULE_UNLOAD -e NETFILTER -e USB -e INPUT -e VT
          make -s olddefconfig
          make -s -j"$(nproc)" modules_prepare

      - name: build every feature profile
        run: |
          kdir=$PWD/linux-${{ matrix.kernel }}
          for profile in all keyboard usb network; do
            echo "::group::profile $profile"
            rm -f .config
            cp configs/defconfig .config
            case $profile in
              keyboard) sed -i 's/^CONFIG_WRONG8007_USB=y/# CONFIG_WRONG8007_USB is not set/;s/^CONFIG_WRONG8007_NETWORK=y/# CONFIG_WRONG8007_NETWORK is not set/' .config ;;
              usb)      sed -i 's/^CONFIG_WRONG8007_KEYBOARD=y/# CONFIG_WRONG8007_KEYBOARD is not set/;s/^CONFIG_WRONG8007_NETWORK=y/# CONFIG_WRONG8007_NETWORK is not set/' .config ;;
              network)  sed -i 's/^CONFIG_WRONG8007_KEYBOARD=y/# CONFIG_WRONG8007_KEYBOARD is not set/;s/^CONFIG_WRONG8007_USB=y/# CONFIG_WRONG8007_USB is not set/' .config ;;
            esac
            make clean KDIR="$kdir" >/dev/null
            # modules_prepare does not generate Module.symvers
            make build KDIR="$kdir" KBUILD_MODPOST_WARN=1 WB_EXTRA_CFLAGS=-Werror
            test -f wrong8007.ko
            echo "::endgroup::"
          done

  tools:
    name: shell tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -s sh tools/*.sh

  kconfig:
    name: kconfig defaults
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: defconfig matches the Kconfig defaults
        run: |
          python3 -m venv "$RUNNER_TEMP/kconfiglib"
          "$RUNNER_TEMP/kconfiglib/bin/pip" install --require-hashes -r .github/kconfiglib.txt
          KCONFIG_CONFIG=defaults.config "$RUNNER_TEMP/kconfiglib/bin/alldefconfig" Kconfig
          diff <(grep CONFIG_ defaults.config) <(grep CONFIG_ configs/defconfig)

  dkms:
    name: dkms
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: install dkms and headers
        run: |
          sudo apt-get update
          sudo apt-get install -y dkms "linux-headers-$(uname -r)"

      - name: install through dkms
        run: make dkms-install

      - name: installed module and files
        run: |
          v=$(sed -n 's/^PACKAGE_VERSION="\(.*\)"$/\1/p' dkms.conf)
          echo "v=$v" >> "$GITHUB_ENV"
          dkms status "wrong8007/$v" | grep installed
          test "$(modinfo -F version wrong8007)" = "$v"
          test -f "/usr/src/wrong8007-$v/dkms.conf"
          systemd-analyze verify /usr/local/lib/systemd/system/wrong8007.service
          test "$(sudo stat -c %a /etc/wrong8007)" = 700

      - name: parameters checked against the installed module
        run: |
          printf 'options wrong8007 exec=/usr/bin/true phrase="ci phrase"\n' > params.conf
          sudo wrong8007-params check wrong8007 params.conf

      - name: build profile in /etc/wrong8007
        run: |
          sed 's/^CONFIG_WRONG8007_NETWORK=y$/# CONFIG_WRONG8007_NETWORK is not set/' configs/defconfig |
            sudo tee /etc/wrong8007/build.config >/dev/null
          sudo dkms remove "wrong8007/$v" --all
          sudo dkms install "wrong8007/$v"
          if modinfo -F parm wrong8007 | grep -q '^match_port:'; then exit 1; fi
          printf 'options wrong8007 exec=/usr/bin/true match_port=1234\n' > params.conf
          if sudo wrong8007-params check wrong8007 params.conf; then exit 1; fi

      - name: uninstall
        run: |
          make dkms-uninstall
          if dkms status | grep -q wrong8007; then exit 1; fi
          test ! -e "/usr/src/wrong8007-$v"
          test ! -e /usr/local/bin/wrong8007-params
